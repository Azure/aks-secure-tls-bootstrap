name: Service Buf CI
on:
  pull_request:
    paths:
      - service/**

permissions:
  contents: read
  pull-requests: write
  
jobs:
  service-buf-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          input: service