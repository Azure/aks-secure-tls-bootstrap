name: Service Buf CI
on:
  pull_request:
    paths:
      - service/**

permissions:
  contents: read
  pull-requests: write
  
jobs:
  service-buf-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1.5.0
        with:
          input: service